<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Chatbot với Product Cards</title>
  <link rel="stylesheet" href="css/chatbot.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .demo-container {
      text-align: center;
      color: white;
    }
    .demo-container h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .demo-container p {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .demo-instruction {
      background: rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 12px;
      max-width: 500px;
      margin: 0 auto;
    }
    .demo-instruction h3 {
      margin-top: 0;
    }
    .demo-instruction ul {
      text-align: left;
      line-height: 2;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>🎉 Chatbot AI với Product Cards</h1>
    <p>Click vào biểu tượng chatbot ở góc dưới bên phải!</p>
    
    <div class="demo-instruction">
      <h3>Thử hỏi:</h3>
      <ul>
        <li>💎 "Tôi muốn mua nhẫn giá 3 triệu"</li>
        <li>💎 "Có bông tai nào đẹp không?"</li>
        <li>💎 "Giới thiệu dây chuyền bạc"</li>
        <li>💎 "Vòng tay charm có không?"</li>
      </ul>
      <p><strong>→ AI sẽ gợi ý sản phẩm và bạn có thể click vào để xem chi tiết!</strong></p>
    </div>
  </div>

  <!-- Chatbot Widget -->
  <div id="chatbot-widget"></div>

  <script src="js/chatbot.js"></script>
</body>
</html>
