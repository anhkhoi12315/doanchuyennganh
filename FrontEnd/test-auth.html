<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Auth State</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 5px;
      border-left: 4px solid #667eea;
    }
    .section h3 {
      margin-top: 0;
      color: #667eea;
    }
    pre {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 3px;
      font-weight: bold;
      margin-left: 10px;
    }
    .status.success {
      background: #4caf50;
      color: white;
    }
    .status.error {
      background: #f44336;
      color: white;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Kiểm tra Trạng thái Authentication</h1>
    
    <div class="section">
      <h3>📦 LocalStorage Keys</h3>
      <div id="localStorage-info"></div>
    </div>

    <div class="section">
      <h3>👤 User Profile</h3>
      <div id="profile-info"></div>
    </div>

    <div class="section">
      <h3>🔑 Token Info</h3>
      <div id="token-info"></div>
    </div>

    <div class="section">
      <h3>🛠️ Actions</h3>
      <button onclick="checkAuth()">🔄 Refresh</button>
      <button onclick="clearAll()">🗑️ Clear All Data</button>
      <button onclick="testAPI()">🧪 Test API</button>
    </div>

    <div class="section" id="api-result" style="display:none;">
      <h3>📡 API Test Result</h3>
      <pre id="api-output"></pre>
    </div>
  </div>

  <script>
    function checkAuth() {
      // LocalStorage info
      const keys = ['accessToken', 'refreshToken', 'profile', 'token'];
      let localStorageHTML = '<ul>';
      keys.forEach(key => {
        const value = localStorage.getItem(key);
        const status = value ? 'success' : 'error';
        const statusText = value ? '✓ Có' : '✗ Không có';
        localStorageHTML += `<li><strong>${key}:</strong> <span class="status ${status}">${statusText}</span>`;
        if (value && key !== 'token') {
          if (key === 'profile') {
            try {
              const parsed = JSON.parse(value);
              localStorageHTML += `<pre>${JSON.stringify(parsed, null, 2)}</pre>`;
            } catch (e) {
              localStorageHTML += `<pre>${value.substring(0, 100)}...</pre>`;
            }
          } else {
            localStorageHTML += `<pre>${value.substring(0, 50)}...</pre>`;
          }
        }
        localStorageHTML += '</li>';
      });
      localStorageHTML += '</ul>';
      document.getElementById('localStorage-info').innerHTML = localStorageHTML;

      // Profile info
      let profileHTML = '';
      try {
        const profile = localStorage.getItem('profile');
        if (profile) {
          const parsed = JSON.parse(profile);
          profileHTML = `<pre>${JSON.stringify(parsed, null, 2)}</pre>`;
        } else {
          profileHTML = '<p class="status error">Không có profile</p>';
        }
      } catch (e) {
        profileHTML = '<p class="status error">Lỗi parse profile</p>';
      }
      document.getElementById('profile-info').innerHTML = profileHTML;

      // Token info
      const accessToken = localStorage.getItem('accessToken');
      const refreshToken = localStorage.getItem('refreshToken');
      let tokenHTML = '';
      
      if (accessToken) {
        try {
          const payload = JSON.parse(atob(accessToken.split('.')[1]));
          tokenHTML += '<h4>Access Token:</h4>';
          tokenHTML += `<pre>${JSON.stringify(payload, null, 2)}</pre>`;
          
          const exp = payload.exp * 1000;
          const now = Date.now();
          const isExpired = exp < now;
          const timeLeft = Math.floor((exp - now) / 1000 / 60);
          
          tokenHTML += `<p>Trạng thái: <span class="status ${isExpired ? 'error' : 'success'}">${isExpired ? 'Đã hết hạn' : `Còn ${timeLeft} phút`}</span></p>`;
        } catch (e) {
          tokenHTML += '<p class="status error">Không thể decode token</p>';
        }
      } else {
        tokenHTML = '<p class="status error">Không có access token</p>';
      }
      
      if (refreshToken) {
        tokenHTML += '<p class="status success">✓ Có refresh token</p>';
      }
      
      document.getElementById('token-info').innerHTML = tokenHTML;
    }

    function clearAll() {
      if (confirm('Xóa tất cả dữ liệu authentication?')) {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        localStorage.removeItem('profile');
        localStorage.removeItem('token');
        alert('Đã xóa tất cả!');
        checkAuth();
      }
    }

    async function testAPI() {
      const token = localStorage.getItem('accessToken');
      if (!token) {
        alert('Không có token để test!');
        return;
      }

      const apiResult = document.getElementById('api-result');
      const apiOutput = document.getElementById('api-output');
      
      apiResult.style.display = 'block';
      apiOutput.textContent = 'Đang gọi API...';

      try {
        const response = await fetch('http://localhost:5000/api/profile/me', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();
        apiOutput.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        apiOutput.textContent = `Lỗi: ${error.message}`;
      }
    }

    // Auto-check on load
    checkAuth();

    // Listen for storage changes
    window.addEventListener('storage', (e) => {
      console.log('Storage changed:', e.key);
      checkAuth();
    });
  </script>
</body>
</html>
