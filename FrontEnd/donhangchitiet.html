<!DOCTYPE html>
<html lang="vn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="icon/Logo.svg" rel="shortcut icon" />
    <title>Chi tiết đơn hàng - KYP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <style>
        .detail-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #f86624;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .detail-header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .order-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .order-meta {
            display: flex;
            gap: 30px;
            color: #666;
        }
        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f86624;
        }
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .product-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .product-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product-info {
            flex: 1;
        }
        .product-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .product-price {
            color: #f86624;
            font-weight: bold;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .info-label {
            font-weight: 600;
            color: #333;
        }
        .info-value {
            color: #666;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            font-size: 24px;
            font-weight: bold;
            color: #f86624;
        }
        .status-timeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .timeline-item {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .timeline-dot {
            width: 12px;
            height: 12px;
            background: #f86624;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .timeline-content {
            flex: 1;
        }
        .timeline-status {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .timeline-date {
            color: #999;
            font-size: 14px;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-cancel {
            background: #dc3545;
            color: white;
        }
        .btn-cancel:hover {
            background: #c82333;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header id="header"></header>

    <div class="detail-container">
        <a href="./donhang.html" class="back-link">← Quay lại danh sách đơn hàng</a>

        <div id="order-detail-content">
            <div style="text-align:center;padding:60px;color:#999;">Đang tải...</div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>
    
    <script>
      if (typeof load === 'function') {
        load("#header", "./template/header.html");
        load("#footer", "./template/footer.html");
      } else {
        setTimeout(() => {
          if (typeof load === 'function') {
            load("#header", "./template/header.html");
            load("#footer", "./template/footer.html");
          }
        }, 100);
      }
    </script>
    <script defer src="js/api.js"></script>
    <script defer src="js/donhangchitiet.js"></script>
</body>
</html>
